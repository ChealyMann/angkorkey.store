<div id="mobile-menu" class="fixed inset-0 z-[100] hidden">
    <div id="menu-overlay" class="fixed inset-0 bg-black/50 backdrop-blur-xs opacity-0 transition-opacity duration-500">
    </div>

    <div class="fixed right-0 top-0 h-full w-[85%] max-w-sm bg-white dark:bg-zinc-900 shadow-2xl transform translate-x-full offcanvas-transition flex flex-col border-l border-gray-200 dark:border-zinc-800 transition-colors duration-300">

        <div class="flex justify-between items-center p-6 border-b border-gray-100 dark:border-zinc-800 relative z-10">
            <div>
                <span class="text-2xl font-black tracking-tight text-gray-900 dark:text-white shrink-0">Angkorkey<span class="text-zinc-400">.</span></span>
            </div>
            <button id="close-menu-button" class="group p-2 rounded-full border border-gray-200 dark:border-zinc-800 hover:border-zinc-950 dark:hover:border-zinc-50 text-gray-500 hover:text-zinc-950 dark:text-zinc-400 transition-all duration-300">
                <i class="w-5 h-5 transition-transform duration-300 group-hover:rotate-90" data-lucide="x"></i>
            </button>
        </div>

        <div class="p-8 overflow-y-auto flex-1 relative z-10 no-scrollbar">
            <nav class="space-y-12">
                <ul class="space-y-6">
                    <li>
                        <a href="{{ url_for('home.home') }}" class="group flex items-center gap-4 text-2xl font-black uppercase tracking-widest {{ 'text-zinc-950 dark:text-white' if request.endpoint == 'home.home' else 'text-zinc-400' }} hover:text-zinc-950 dark:hover:text-white transition-colors">
                            {{ _('home') }}
                        </a>
                    </li>
                    <li>
                        <a href="{{ url_for('home.products') }}" class="group flex items-center gap-4 text-2xl font-black uppercase tracking-widest {{ 'text-zinc-950 dark:text-white' if request.endpoint == 'home.products' else 'text-zinc-400' }} hover:text-zinc-950 dark:hover:text-white transition-colors">
                            {{ _('products') }}
                        </a>
                    </li>
                    <li>
                        <a href="{{ url_for('home.promotions') }}" class="group flex items-center gap-4 text-2xl font-black uppercase tracking-widest {{ 'text-zinc-950 dark:text-white' if request.endpoint == 'home.promotions' else 'text-zinc-400' }} hover:text-zinc-950 dark:hover:text-white transition-colors">
                            {{ _('promotions') }}
                        </a>
                    </li>

                    <!-- Mobile Theme Toggle -->
                    <li class="pt-6 border-t border-gray-100 dark:border-zinc-800">
                        <button id="mobile-theme-toggle" class="w-full flex items-center justify-between py-2 text-sm font-bold uppercase tracking-widest text-zinc-400 hover:text-zinc-950 dark:hover:text-white transition-colors cursor-pointer">
                            <span>{{ _('theme') }}</span>
                            <span class="flex items-center gap-2">
                                <span id="mobile-theme-text" class="text-xs font-semibold text-zinc-500">Light</span>
                                <!-- Moon icon -->
                                <i id="mobile-theme-moon" class="h-5 w-5" data-lucide="moon"></i>
                                <!-- Sun icon -->
                                <i id="mobile-theme-sun" class="h-5 w-5" data-lucide="sun"></i>
                            </span>
                        </button>
                    </li>

                    <!-- Mobile Language Switcher -->
                    <li class="pt-4 border-t border-gray-100 dark:border-zinc-800">
                        <div class="w-full flex items-center justify-between py-2 text-sm font-bold uppercase tracking-widest text-zinc-400">
                            <span>{{ _('language') }}</span>
                            <div class="flex items-center gap-2">
                                <a href="/set_lang/en" class="text-xs font-bold px-3 py-1.5 rounded-lg transition-colors {{ 'bg-zinc-950 text-white dark:bg-white dark:text-black' if session.get('lang', 'en') == 'en' else 'text-zinc-500 hover:text-zinc-950 dark:hover:text-white' }}">
                                    EN
                                </a>
                                <a href="/set_lang/km" class="text-xs font-bold px-3 py-1.5 rounded-lg transition-colors {{ 'bg-zinc-950 text-white dark:bg-white dark:text-black' if session.get('lang', 'en') == 'km' else 'text-zinc-500 hover:text-zinc-950 dark:hover:text-white' }}">
                                    KM
                                </a>
                            </div>
                        </div>
                    </li>
                </ul>

                <div class="pt-8 border-t border-gray-100 dark:border-zinc-800">
                    <p class="text-[10px] font-bold text-zinc-400 dark:text-zinc-500 uppercase tracking-[0.2em] mb-6">{{ _('explore_categories') }}</p>
                    <div class="grid grid-cols-1 gap-2">
                        {% for category in categories %}
                        <a href="{{ url_for('home.products', category_id=category.id) }}"
                            class="flex items-center justify-between py-3 rounded-none border-b border-gray-100 dark:border-zinc-800 hover:border-zinc-950 dark:hover:border-zinc-50 transition-all group">
                            <span class="text-xs font-bold uppercase tracking-widest {{ 'text-zinc-950 dark:text-white' if request.view_args.get('category_id')|string == category.id|string else 'text-zinc-400' }} group-hover:text-zinc-950 dark:group-hover:text-white transition-colors">{{ category.name }}</span>
                            <i class="w-4 h-4 {{ 'text-zinc-950 dark:text-white translate-x-1' if request.view_args.get('category_id')|string == category.id|string else 'text-zinc-200 dark:text-zinc-700' }} group-hover:text-zinc-950 dark:group-hover:text-white transition-colors transform group-hover:translate-x-1" data-lucide="chevron-right"></i>
                        </a>
                        {% endfor %}
                    </div>
                </div>
            </nav>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const mobThemeToggle = document.getElementById('mobile-theme-toggle');
        
        if (mobThemeToggle) {
            mobThemeToggle.addEventListener('click', () => {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                }
                if (typeof window.applyTheme === 'function') {
                    window.applyTheme();
                }
            });
        }
        
        // Initial load
        if (typeof window.applyTheme === 'function') {
            window.applyTheme();
        }
    });
</script>

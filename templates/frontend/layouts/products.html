<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-20">

    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">

            <button class="px-6 py-2.5 rounded-full bg-red-600 text-white text-xs font-bold uppercase tracking-widest transition-all whitespace-nowrap shadow-sm">

            <button class="px-6 py-2.5 rounded-full bg-white border border-gray-200 text-gray-500 hover:text-red-600 hover:border-red-600 text-xs font-bold uppercase tracking-widest transition-all whitespace-nowrap shadow-xs">

                <img src="https://images.unsplash.com/photo-1511467687858-23d96c32e4ae?w=500&auto=format&fit=crop&q=60"
                     alt="Product"
                     class="absolute inset-0 w-full h-full object-cover opacity-90 group-hover:opacity-100 group-hover:scale-105 transition-transform duration-700 ease-out">

                    </div>
                </div>
            </div>
        </div>

        <div class="product-card group flex flex-col rounded-2xl bg-white border border-gray-200 hover:border-red-600 overflow-hidden transition-all duration-500 shadow-sm hover:shadow-md"
             data-name="Moondrop" data-category="audio">

                     alt="Product"
                     class="absolute inset-0 w-full h-full object-cover opacity-90 group-hover:opacity-100 group-hover:scale-105 transition-transform duration-700 ease-out">

                    <span class="bg-red-600 text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-widest shadow-md">Sale</span>

                <h3 class="text-sm font-bold text-gray-900 leading-tight mb-4 line-clamp-2">Moondrop Aria</h3>
                <div class="mt-auto flex justify-between items-end">
                    <div class="flex flex-col gap-1 leading-none">
                        <span class="text-xs text-gray-400 line-through">$89.99</span>
                        <span class="text-sm md:text-base font-bold text-red-600">$79.99</span>

             data-name="Logitech" data-category="mice">
            <div class="relative pt-[100%] overflow-hidden bg-gray-50">

             data-name="Keycaps" data-category="keyboards">
            <div class="relative pt-[100%] overflow-hidden bg-gray-50">
                <img src="https://images.unsplash.com/photo-1605773527852-c546a8584ea3?w=500&auto=format&fit=crop&q=60"
                     alt="Product"
                     class="absolute inset-0 w-full h-full object-cover opacity-90 group-hover:opacity-100 group-hover:scale-105 transition-transform duration-700 ease-out">

                <div class="mt-auto flex justify-between items-end">

        <button onclick="window.angkorkeyStore.clearFilters()" class="border border-gray-300 text-gray-700 bg-white px-8 py-3 rounded-full text-xs font-bold uppercase tracking-widest hover:bg-red-600 hover:text-white hover:border-red-600 transition-colors shadow-sm">Clear Filters</button>

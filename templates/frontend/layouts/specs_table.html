<div class="max-w-2xl overflow-hidden rounded-2xl border border-gray-100 bg-white">
    <table class="w-full text-left border-collapse text-sm">
        <tbody>
            <!-- Brand -->
            {% if product.brand %}
            <tr class="border-b border-gray-50 hover:bg-gray-50/50 transition-colors">
                <th class="px-5 py-4 font-bold text-gray-500 w-1/3">Brand</th>
                <td class="px-5 py-4 text-gray-900 font-semibold">{{ product.brand.name }}</td>
            </tr>
            {% endif %}

            <!-- Category -->
            <tr class="border-b border-gray-50 hover:bg-gray-50/50 transition-colors">
                <th class="px-5 py-4 font-bold text-gray-500 w-1/3">Collection</th>
                <td class="px-5 py-4 text-gray-900 font-semibold">{{ product.category_name.name }}</td>
            </tr>

            <!-- Base Price -->
            <tr class="border-b border-gray-50 hover:bg-gray-50/50 transition-colors">
                <th class="px-5 py-4 font-bold text-gray-500 w-1/3">Retail Price</th>
                <td class="px-5 py-4 text-gray-900 font-semibold">${{ "%.2f"|format(product.price) }}</td>
            </tr>

            <!-- Status -->
            <tr class="border-b border-gray-50 hover:bg-gray-50/50 transition-colors">
                <th class="px-5 py-4 font-bold text-gray-500 w-1/3">Status</th>
                <td class="px-5 py-4 font-semibold text-emerald-600">Active Listing</td>
            </tr>

            <!-- Active Options (if variants exist) -->
            {% if option_groups %}
            <tr class="hover:bg-gray-50/50 transition-colors">
                <th class="px-5 py-4 font-bold text-gray-500 w-1/3">Customization</th>
                <td class="px-5 py-4 text-gray-900 font-semibold">
                    <div class="flex flex-wrap gap-1.5">
                        {% for group in option_groups %}
                        <span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-semibold bg-red-50 text-red-700 border border-red-100">
                            {{ group.name }}
                        </span>
                        {% endfor %}
                    </div>
                </td>
            </tr>
            {% endif %}
        </tbody>
    </table>
</div>

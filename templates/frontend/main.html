<!doctype html>
<html lang="{{ session.get('lang', 'en') }}">
<!-- ==================== HEAD SECTION ==================== -->

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Angkorkey</title>
    <link rel="icon" type="image/jpg" href="{{ url_for('static', filename='logo/logo.jpg') }}">

    <!-- Initialize theme immediately to prevent layout flash -->
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        window.applyTheme = function() {
            const isDark = document.documentElement.classList.contains('dark');
            const sunIcon = document.getElementById('theme-toggle-sun');
            const moonIcon = document.getElementById('theme-toggle-moon');
            if (sunIcon) sunIcon.style.display = isDark ? 'block' : 'none';
            if (moonIcon) moonIcon.style.display = isDark ? 'none' : 'block';

            const mobSunIcon = document.getElementById('mobile-theme-sun');
            const mobMoonIcon = document.getElementById('mobile-theme-moon');
            if (mobSunIcon) mobSunIcon.style.display = isDark ? 'block' : 'none';
            if (mobMoonIcon) mobMoonIcon.style.display = isDark ? 'none' : 'block';

            const mobThemeText = document.getElementById('mobile-theme-text');
            if (mobThemeText) mobThemeText.textContent = isDark ? 'Dark' : 'Light';
        };
    </script>

    <!-- External Scripts & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link
        href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,300..700;1,300..700&family=Outfit:wght@300;400;500;700;900&display=swap"
        rel="stylesheet"
    />

    <!-- ========== CUSTOM STYLES ========== -->
    <style>

        {#/product category partial#}
        .category-title {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
            color: var(--text-base);
        }

        html[lang="km"] {
            --font-sans: 'Kantumruy Pro', 'Outfit', sans-serif !important;
        }

        :root {
            --font-sans: 'Outfit', sans-serif;
            --bg-base: #ffffff;
            --bg-surface: #ffffff;
            --text-base: #09090b;       /* zinc-950 */
            --text-muted: #71717a;      /* zinc-500 */
            --border-line: rgba(9, 9, 11, 0.08);
            --accent: #09090b;          /* monochrome active */
            --accent-hover: #000000;
            --accent-dim: rgba(9, 9, 11, 0.04);
        }

        .dark {
            --bg-base: #09090b;         /* zinc-950 */
            --bg-surface: #18181b;      /* zinc-900 */
            --text-base: #f4f4f5;       /* zinc-100 */
            --text-muted: #a1a1aa;      /* zinc-400 */
            --border-line: rgba(244, 244, 245, 0.08);
            --accent: #f4f4f5;          /* monochrome active */
            --accent-hover: #ffffff;
            --accent-dim: rgba(244, 244, 245, 0.08);
        }

        /* Catch-all global overrides for existing templates in dark mode */
        .dark .text-gray-900 { color: #ffffff !important; }
        .dark .text-gray-800 { color: #f4f4f5 !important; }
        .dark .text-gray-700 { color: #e4e4e7 !important; }
        .dark .text-gray-650 { color: #e4e4e7 !important; }
        .dark .text-gray-600 { color: #d4d4d8 !important; }
        .dark .text-gray-500 { color: #a1a1aa !important; }
        .dark .text-gray-400 { color: #71717a !important; }
        .dark .text-gray-300 { color: #52525b !important; }

        .dark .text-zinc-900 { color: #ffffff !important; }
        .dark .text-zinc-800 { color: #f4f4f5 !important; }
        .dark .text-zinc-700 { color: #e4e4e7 !important; }
        .dark .text-zinc-650 { color: #e4e4e7 !important; }
        .dark .text-zinc-600 { color: #d4d4d8 !important; }
        .dark .text-zinc-500 { color: #a1a1aa !important; }
        .dark .text-zinc-400 { color: #71717a !important; }
        .dark .text-zinc-300 { color: #52525b !important; }

        /* Explore category card button styling override */
        .category-explore-btn {
            color: #09090b !important;
        }
        .group:hover .category-explore-btn {
            color: #ffffff !important;
        }

        .dark .bg-white { background-color: #09090b !important; }
        .dark .bg-gray-50 { background-color: #09090b !important; }
        .dark .bg-gray-100 { background-color: #18181b !important; }
        .dark .bg-zinc-50 { background-color: #09090b !important; }

        .dark .border-gray-200 { border-color: rgba(255, 255, 255, 0.08) !important; }
        .dark .border-gray-100 { border-color: rgba(255, 255, 255, 0.05) !important; }
        .dark .border-zinc-200 { border-color: rgba(255, 255, 255, 0.08) !important; }
        .dark .border-zinc-100 { border-color: rgba(255, 255, 255, 0.05) !important; }

        .dark .hover\:text-zinc-950:hover { color: #ffffff !important; }
        .dark .hover\:text-gray-900:hover { color: #ffffff !important; }
        .dark .hover\:bg-gray-50:hover { background-color: #18181b !important; }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-base);
            color: var(--text-base);
            padding-bottom: 80px;
        }

        /* Custom smooth transition classes */
        .futuristic-card-info {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .group:hover .futuristic-card-info {
            transform: translateY(-4px);
        }

        .futuristic-btn {
            letter-spacing: 0.1em;
            transition: letter-spacing 0.3s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.3s, color 0.3s;
        }
        .futuristic-btn:hover {
            letter-spacing: 0.18em;
        }

        @media (min-width: 768px) {
            body {
                padding-bottom: 0;
            }
        }

        .smooth-transition {
            transition-property: all;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 300ms;
        }

        .offcanvas-transition {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.overflow-hidden {
            overflow: hidden;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-0.5rem) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .dropdown:hover .dropdown-menu {
            display: block !important;
            animation: fadeInDown 0.2s ease-out forwards;
        }

        .dropdown-menu::before {
            content: "";
            position: absolute;
            top: -0.75rem;
            left: 0;
            right: 0;
            height: 0.75rem;
            background-color: transparent;
        }

        .clamp-responsive {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            -webkit-line-clamp: 1;
        }

        @media (min-width: 640px) {
            .clamp-responsive {
                -webkit-line-clamp: 2;
            }
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Explicit theme toggle visibility controls */
        #theme-toggle-sun, #mobile-theme-sun {
            display: none !important;
        }
        #theme-toggle-moon, #mobile-theme-moon {
            display: inline-block !important;
        }
        .dark #theme-toggle-sun, .dark #mobile-theme-sun {
            display: inline-block !important;
        }
        .dark #theme-toggle-moon, .dark #mobile-theme-moon {
            display: none !important;
        }
    </style>
    <script id="translations-json" type="application/json">
        {{ translations_json | safe }}
    </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-zinc-950 dark:text-zinc-50 antialiased selection:bg-red-500 selection:text-white min-h-screen transition-colors duration-300">
{% include("frontend/layouts/header.html") %}

<!-- ==================== MAIN CONTENT CONTAINER ==================== -->
<div id="content-main" class="max-w-7xl mx-auto">
    {% block content %}{% endblock %}
</div>

<!-- ==================== FOOTER ==================== -->
{% include("frontend/layouts/footer.html") %}

<!-- ==================== MOBILE MENU (Off-Canvas) ==================== -->
{% include("frontend/layouts/mobile_menu.html") %}
{% include("frontend/layouts/mobile_categories.html") %}

<!-- ==================== JAVASCRIPT ==================== -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
        const carousel = document.getElementById("carousel");

        if (carousel) {
            const prevBtn = document.getElementById("prev-btn");
            const nextBtn = document.getElementById("next-btn");
            let currentSlide = 0;
            const totalSlides = carousel.children.length;

            function updateSlide() {
                const offset = currentSlide * -100;
                carousel.style.transform = `translateX(${offset}%)`;
            }

            if (nextBtn) {
                nextBtn.addEventListener("click", () => {
                    currentSlide = (currentSlide + 1) % totalSlides;
                    updateSlide();
                });
            }

            if (prevBtn) {
                prevBtn.addEventListener("click", () => {
                    currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
                    updateSlide();
                });
            }

            setInterval(() => {
                currentSlide = (currentSlide + 1) % totalSlides;
                updateSlide();
            }, 6000);
        }

        const mobileMenu = document.getElementById("mobile-menu");

        if (mobileMenu) {
            const menuOverlay = document.getElementById("menu-overlay");
            const menuDrawer = mobileMenu.querySelector(".offcanvas-transition");
            const openMenuBtn = document.getElementById("mobile-menu-button");
            const closeMenuBtn = document.getElementById("close-menu-button");

            function toggleMenu(open) {
                if (!menuOverlay || !menuDrawer) return;

                if (open) {
                    mobileMenu.classList.remove("hidden");
                    document.body.classList.add("overflow-hidden");

                    setTimeout(() => {
                        menuOverlay.style.opacity = "1";
                        menuDrawer.style.transform = "translateX(0)";
                    }, 10);
                } else {
                    menuOverlay.style.opacity = "0";
                    menuDrawer.style.transform = "translateX(100%)";
                    document.body.classList.remove("overflow-hidden");

                    setTimeout(() => {
                        mobileMenu.classList.add("hidden");
                    }, 400);
                }
            }

            if (openMenuBtn) {
                openMenuBtn.addEventListener("click", () => toggleMenu(true));
            }

            if (closeMenuBtn) {
                closeMenuBtn.addEventListener("click", () => toggleMenu(false));
            }

            if (menuOverlay) {
                menuOverlay.addEventListener("click", () => toggleMenu(false));
            }
        }

        const mobileCategoryMenu = document.getElementById("mobile-category-menu");

        if (mobileCategoryMenu) {
            const categoryOverlay = document.getElementById("category-overlay");
            const categoryDrawer = mobileCategoryMenu.querySelector(".offcanvas-transition");
            const openCategoryBtn = document.getElementById("mobile-category-button");
            const closeCategoryBtn = document.getElementById("close-category-button");

            function toggleCategoryMenu(open) {
                if (!categoryOverlay || !categoryDrawer) return;

                if (open) {
                    mobileCategoryMenu.classList.remove("hidden");
                    document.body.classList.add("overflow-hidden");

                    if (mobileMenu && !mobileMenu.classList.contains("hidden")) {
                        mobileMenu.classList.add("hidden");
                    }

                    setTimeout(() => {
                        categoryOverlay.style.opacity = "1";
                        categoryDrawer.style.transform = "translateX(0)";
                    }, 10);
                } else {
                    categoryOverlay.style.opacity = "0";
                    categoryDrawer.style.transform = "translateX(100%)";
                    document.body.classList.remove("overflow-hidden");

                    setTimeout(() => {
                        mobileCategoryMenu.classList.add("hidden");
                    }, 400);
                }
            }

            if (openCategoryBtn) {
                openCategoryBtn.addEventListener("click", () => toggleCategoryMenu(true));
            }

            if (closeCategoryBtn) {
                closeCategoryBtn.addEventListener("click", () => toggleCategoryMenu(false));
            }

            if (categoryOverlay) {
                categoryOverlay.addEventListener("click", () => toggleCategoryMenu(false));
            }
        }

        const TRANSLATIONS = JSON.parse(document.getElementById('translations-json').textContent || '{}');

        window.translatePage = function(lang) {
            const enStrings = TRANSLATIONS['en'] || {};
            const kmStrings = TRANSLATIONS['km'] || {};
            
            // Map of English text to Khmer text
            const enToKm = {};
            const kmToEn = {};
            for (const key in enStrings) {
                const enVal = enStrings[key].trim();
                const kmVal = kmStrings[key].trim();
                enToKm[enVal] = kmVal;
                kmToEn[kmVal] = enVal;
            }
            
            // Set html lang attribute
            document.documentElement.setAttribute('lang', lang);
            
            // Recursive function to traverse DOM text nodes
            function traverse(node) {
                // Skip script and style tags
                if (['SCRIPT', 'STYLE', 'TEXTAREA'].includes(node.tagName)) {
                    return;
                }
                
                if (node.nodeType === Node.TEXT_NODE) {
                    const originalVal = node.nodeValue;
                    const trimmed = originalVal.trim();
                    if (trimmed) {
                        if (lang === 'km') {
                            if (enToKm[trimmed]) {
                                if (node._originalText === undefined) {
                                    node._originalText = originalVal;
                                }
                                node.nodeValue = originalVal.replace(trimmed, enToKm[trimmed]);
                            }
                        } else {
                            if (node._originalText !== undefined) {
                                node.nodeValue = node._originalText;
                            } else if (kmToEn[trimmed]) {
                                node.nodeValue = originalVal.replace(trimmed, kmToEn[trimmed]);
                            }
                        }
                    }
                } else {
                    // Translate inputs
                    if (node.tagName === 'INPUT' && (node.type === 'text' || node.type === 'search')) {
                        const placeholder = node.placeholder;
                        if (placeholder) {
                            const trimmedPh = placeholder.trim();
                            if (lang === 'km') {
                                if (enToKm[trimmedPh]) {
                                    if (node._originalPlaceholder === undefined) {
                                        node._originalPlaceholder = placeholder;
                                    }
                                    node.placeholder = enToKm[trimmedPh];
                                }
                            } else {
                                if (node._originalPlaceholder !== undefined) {
                                    node.placeholder = node._originalPlaceholder;
                                }
                            }
                        }
                    }
                    
                    // Translate titles
                    if (node.hasAttribute && node.hasAttribute('title')) {
                        const title = node.getAttribute('title');
                        if (title) {
                            const trimmedTitle = title.trim();
                            if (lang === 'km') {
                                if (enToKm[trimmedTitle]) {
                                    if (node._originalTitle === undefined) {
                                        node._originalTitle = title;
                                    }
                                    node.setAttribute('title', enToKm[trimmedTitle]);
                                }
                            } else {
                                if (node._originalTitle !== undefined) {
                                    node.setAttribute('title', node._originalTitle);
                                }
                            }
                        }
                    }
                    
                    // Recurse children
                    for (let child of node.childNodes) {
                        traverse(child);
                    }
                }
            }
            
            traverse(document.body);
            
            // Update sliding language switchers UI
            const backdrops = document.querySelectorAll('.bg-zinc-100 .absolute, .bg-zinc-800 .absolute');
            backdrops.forEach(bd => {
                if (lang === 'km') {
                    bd.classList.remove('translate-x-0');
                    bd.classList.add('translate-x-[42px]');
                } else {
                    bd.classList.remove('translate-x-[42px]');
                    bd.classList.add('translate-x-0');
                }
            });
            
            // Update sliding switcher flag opacities
            const enFlagImg = document.querySelector('header img[alt="English"]');
            const kmFlagImg = document.querySelector('header img[alt="Khmer"]');
            if (enFlagImg && kmFlagImg) {
                if (lang === 'en') {
                    enFlagImg.classList.remove('opacity-50', 'hover:opacity-80');
                    kmFlagImg.classList.add('opacity-50', 'hover:opacity-80');
                } else {
                    kmFlagImg.classList.remove('opacity-50', 'hover:opacity-80');
                    enFlagImg.classList.add('opacity-50', 'hover:opacity-80');
                }
            }
            
            // Update mobile single flag toggle button
            const mobToggleLink = document.querySelector('.mobile-lang-toggle');
            if (mobToggleLink) {
                if (lang === 'km') {
                    mobToggleLink.setAttribute('href', '/set_lang/en');
                    mobToggleLink.setAttribute('title', 'Switch to English');
                    const img = mobToggleLink.querySelector('img');
                    if (img) {
                        img.setAttribute('src', 'https://flagcdn.com/24x18/gb.png');
                        img.setAttribute('alt', 'English');
                    }
                } else {
                    mobToggleLink.setAttribute('href', '/set_lang/km');
                    mobToggleLink.setAttribute('title', 'ប្តូរទៅភាសាខ្មែរ');
                    const img = mobToggleLink.querySelector('img');
                    if (img) {
                        img.setAttribute('src', 'https://flagcdn.com/24x18/kh.png');
                        img.setAttribute('alt', 'Khmer');
                    }
                }
            }
            
            // Update mobile menu switcher buttons active state
            const mobEnBtn = document.querySelector('#mobile-menu a[href="/set_lang/en"]');
            const mobKmBtn = document.querySelector('#mobile-menu a[href="/set_lang/km"]');
            if (mobEnBtn && mobKmBtn) {
                const activeClasses = ['bg-zinc-100', 'dark:bg-zinc-800', 'border', 'border-gray-200', 'dark:border-zinc-700'];
                if (lang === 'en') {
                    mobEnBtn.classList.add(...activeClasses);
                    mobEnBtn.classList.remove('opacity-60');
                    mobKmBtn.classList.remove(...activeClasses);
                    mobKmBtn.classList.add('opacity-60');
                } else {
                    mobKmBtn.classList.add(...activeClasses);
                    mobKmBtn.classList.remove('opacity-60');
                    mobEnBtn.classList.remove(...activeClasses);
                    mobEnBtn.classList.add('opacity-60');
                }
            }
        };

        const SKELETON_TEMPLATE = `
<div class="animate-pulse px-4 py-6 md:py-10 max-w-7xl mx-auto">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12">
        <!-- Left: Image Gallery Skeleton -->
        <div class="space-y-4">
            <div class="w-full aspect-square bg-zinc-200 dark:bg-zinc-800 rounded-none"></div>
            <div class="flex gap-2">
                <div class="w-20 h-20 bg-zinc-200 dark:bg-zinc-800 rounded-none"></div>
                <div class="w-20 h-20 bg-zinc-200 dark:bg-zinc-800 rounded-none"></div>
                <div class="w-20 h-20 bg-zinc-200 dark:bg-zinc-800 rounded-none"></div>
            </div>
        </div>
        <!-- Right: Detail Info Skeleton -->
        <div class="space-y-6">
            <div class="h-8 bg-zinc-200 dark:bg-zinc-800 rounded-none w-3/4"></div>
            <div class="h-6 bg-zinc-200 dark:bg-zinc-800 rounded-none w-1/4"></div>
            <div class="space-y-2 pt-4">
                <div class="h-4 bg-zinc-200 dark:bg-zinc-800 rounded-none w-1/3"></div>
                <div class="flex gap-2">
                    <div class="w-16 h-8 bg-zinc-200 dark:bg-zinc-800 rounded-none"></div>
                    <div class="w-16 h-8 bg-zinc-200 dark:bg-zinc-800 rounded-none"></div>
                </div>
            </div>
            <div class="h-12 bg-zinc-200 dark:bg-zinc-800 rounded-none w-full mt-8"></div>
        </div>
    </div>
</div>
`;

        // SPA-like tab switcher for mobile bottom navigation bar with cache
        const contentMain = document.getElementById('content-main');
        const pageCache = {};
        const scrollCache = {};
        let currentLang = localStorage.getItem('lang') || document.documentElement.getAttribute('lang') || 'en';

        // Keep scroll restoring working perfectly for browser history navigation
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }

        // Track page scroll positions continuously in real-time
        window.addEventListener('scroll', () => {
            scrollCache[window.location.pathname] = window.scrollY;
        }, { passive: true });

        // Initial translation on page load
        window.translatePage(currentLang);

        async function navigateTo(url, isBack = false) {
            const cacheKey = `${url}::${currentLang}`;
            
            let htmlText;
            if (pageCache[cacheKey]) {
                htmlText = pageCache[cacheKey];
            } else {
                if (url.includes('/product_detail/') && contentMain) {
                    contentMain.innerHTML = SKELETON_TEMPLATE;
                    contentMain.style.opacity = '1';
                    window.scrollTo({ top: 0, behavior: 'instant' });
                }
                try {
                    const res = await fetch(url);
                    htmlText = await res.text();
                    pageCache[cacheKey] = htmlText;
                } catch (err) {
                    console.error('Failed to load page:', err);
                    window.location.href = url;
                    return;
                }
            }
            
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, 'text/html');
            
            // Swap Header
            const oldHeader = document.querySelector('header');
            const newHeader = doc.querySelector('header');
            if (oldHeader && newHeader) {
                oldHeader.outerHTML = newHeader.outerHTML;
            }
            
            // Swap Main Content
            const oldContent = document.getElementById('content-main');
            const newContent = doc.getElementById('content-main');
            if (oldContent && newContent) {
                oldContent.innerHTML = newContent.innerHTML;
            }
            
            // Swap Footer
            const oldFooter = document.querySelector('footer');
            const newFooter = doc.querySelector('footer');
            if (oldFooter && newFooter) {
                oldFooter.outerHTML = newFooter.outerHTML;
            }
            
            // Swap Bottom Nav Container
            const oldNav = document.getElementById('bottom-nav-container');
            const newNav = doc.getElementById('bottom-nav-container');
            if (oldNav && newNav) {
                oldNav.innerHTML = newNav.innerHTML;
                const newMobileLinks = oldNav.querySelectorAll('a');
                newMobileLinks.forEach(link => {
                    link.addEventListener('click', handleBottomNavClick);
                });
            }
            
            // Swap Mobile Menu
            const oldMenu = document.getElementById('mobile-menu');
            const newMenu = doc.getElementById('mobile-menu');
            if (oldMenu && newMenu) {
                oldMenu.outerHTML = newMenu.outerHTML;
            }
            
            // Scroll control: Restore saved position on back navigation, or scroll to top on new paths
            if (isBack && scrollCache[url] !== undefined) {
                window.scrollTo({ top: scrollCache[url], behavior: 'instant' });
            } else {
                window.scrollTo({ top: 0, behavior: 'instant' });
            }
            
            // Re-run script tags inside content-main
            const scripts = document.getElementById('content-main').querySelectorAll('script');
            scripts.forEach(script => {
                const newScript = document.createElement('script');
                Array.from(script.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                newScript.appendChild(document.createTextNode(script.innerHTML));
                script.parentNode.replaceChild(newScript, script);
            });
            
            // Translate the page to the active language
            window.translatePage(currentLang);
            
            // Re-initialize Lucide Icons
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
            
            // Re-bind theme toggles and mobile menu events
            if (typeof window.initHeaderLogic === 'function') {
                window.initHeaderLogic();
            }
            if (typeof window.initMobileMenuLogic === 'function') {
                window.initMobileMenuLogic();
            }
        }

        async function handleBottomNavClick(e) {
            const link = e.currentTarget;
            const href = link.getAttribute('href');
            if (href && href.startsWith('/') && !href.includes('#')) {
                e.preventDefault();
                
                if (contentMain) {
                    contentMain.style.opacity = '0.5';
                    contentMain.style.transition = 'opacity 0.15s ease-in-out';
                }
                
                await navigateTo(href);
                
                history.pushState(null, '', href);
                updateActiveNavbarTab(href);
                
                if (contentMain) {
                    contentMain.style.opacity = '1';
                }
            }
        }

        // Mobile bottom navigation bar links handler
        const initialMobileLinks = document.querySelectorAll('#bottom-nav-container a');
        initialMobileLinks.forEach(link => {
            link.addEventListener('click', handleBottomNavClick);
        });

        // Intercept clicks on product detail links for instant AJAX load
        document.body.addEventListener('click', async (e) => {
            const productLink = e.target.closest('a[href^="/product_detail/"]');
            if (productLink) {
                e.preventDefault();
                const href = productLink.getAttribute('href');
                
                if (contentMain) {
                    contentMain.style.opacity = '0.5';
                    contentMain.style.transition = 'opacity 0.15s ease-in-out';
                }
                
                await navigateTo(href);
                
                history.pushState(null, '', href);
                
                if (contentMain) {
                    contentMain.style.opacity = '1';
                }
            }
        });

        // Background prefetch on hover or touchstart
        const prefetchLink = (href) => {
            const cacheKey = `${href}::${currentLang}`;
            if (!pageCache[cacheKey]) {
                fetch(href).then(res => res.text()).then(html => {
                    pageCache[cacheKey] = html;
                }).catch(() => {});
            }
        };

        document.body.addEventListener('mouseover', (e) => {
            const link = e.target.closest('a[href^="/product_detail/"]');
            if (link) {
                prefetchLink(link.getAttribute('href'));
            }
        });

        document.body.addEventListener('touchstart', (e) => {
            const link = e.target.closest('a[href^="/product_detail/"]');
            if (link) {
                prefetchLink(link.getAttribute('href'));
            }
        }, { passive: true });

        // AJAX Language Switcher (No full page reload, uses caching)
        document.body.addEventListener('click', async (e) => {
            const langLink = e.target.closest('a[href^="/set_lang/"]');
            if (langLink) {
                e.preventDefault();
                const href = langLink.getAttribute('href');
                const targetLang = href.split('/').pop(); // 'en' or 'km'
                
                // Switch language client-side instantly!
                window.translatePage(targetLang);
                currentLang = targetLang;
                localStorage.setItem('lang', targetLang);
                
                // Fire server-side update asynchronously in background
                fetch(href).catch(err => console.error('Failed to sync language to server:', err));
            }
        });

        function updateActiveNavbarTab(currentPath) {
            const currentMobileLinks = document.querySelectorAll('#bottom-nav-container a');
            currentMobileLinks.forEach(link => {
                const href = link.getAttribute('href');
                const isActive = (href === currentPath) || (currentPath === '/' && href === '/home') || (currentPath === '/home' && href === '/');
                
                const icon = link.querySelector('svg, i');
                const label = link.querySelector('span');
                
                if (isActive) {
                    if (icon) {
                        icon.setAttribute('class', 'h-5 w-5 text-red-600 dark:text-white transition-all duration-300 scale-105');
                    }
                    if (label) {
                        label.className = 'text-[9px] font-bold text-red-600 dark:text-white mt-1 uppercase tracking-wider';
                    }
                } else {
                    if (icon) {
                        icon.setAttribute('class', 'h-5 w-5 text-gray-400 dark:text-zinc-500 hover:text-gray-600 dark:hover:text-zinc-400 group-active:scale-95 transition-all duration-200');
                    }
                    if (label) {
                        label.className = 'text-[9px] font-medium text-gray-400 dark:text-zinc-500 mt-1 uppercase tracking-wider';
                    }
                }
            });
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        // Intercept popstate (browser back/forward button clicks) to navigate dynamically
        window.addEventListener('popstate', async () => {
            const path = window.location.pathname;
            
            if (contentMain) {
                contentMain.style.opacity = '0.5';
                contentMain.style.transition = 'opacity 0.15s ease-in-out';
            }
            
            await navigateTo(path, true);
            updateActiveNavbarTab(path);
            
            if (contentMain) {
                contentMain.style.opacity = '1';
            }
        });

        // Register Service Worker for instant loading on slow connections
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((reg) => console.log('Service Worker registered successfully with scope:', reg.scope))
                    .catch((err) => console.error('Service Worker registration failed:', err));
            });
        }
    });
</script>
</body>

</html>
